[project]
name = "knotwork"
version = "0.1.0"
description = "Knotwork: a proof-carrying synthetic visual task factory (Innodata AI Hackathon 2026, Track 2: Visual Task Factory)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Knotwork Team" }]
dependencies = [
  "pydantic>=2.7,<3",
  "pillow>=10.3,<13",
  "numpy>=1.26,<3",
  "scipy>=1.11",
  "scikit-image>=0.22",
  "shapely>=2.0",
  "rapidocr-onnxruntime>=1.3.24",
  "scikit-learn>=1.4",
  "imagehash>=4.3",
  "pyarrow>=15",
  "pandas>=2.1",
  "click>=8.1",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "streamlit>=1.36",
  "matplotlib>=3.8",
]

[project.scripts]
knot = "knotwork.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-timeout>=2.3",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "import-linter>=2.0",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knotwork"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "apps"]
extend-exclude = ["artifacts", "bench_replay", "data", ".checkpoints"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["knotwork"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["knotwork"]
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "knotwork.knotcore.*"
strict = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib -m 'not network and not live'"
timeout = 900
markers = [
  "network: touches the public internet (deselected by default)",
  "live: spends money on paid APIs (deselected by default; never run autonomously)",
  "slow: long-running (> 30 s)",
]
filterwarnings = ["ignore::DeprecationWarning:onnxruntime.*"]
