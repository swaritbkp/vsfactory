name: ci

# Fast feedback on every push and pull request, under 2 minutes wall time: tier0 (lint, types,
# import isolation, seed KAT, pure kernel and contract checks) reports in about 40 s, while tier1
# (plugins, pipeline, faults on shared fixtures) runs in parallel. tier2 and the phase gates run in
# nightly.yml (scheduled or manual).

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  KNOTWORK_NETWORK: deny
  PYTHONHASHSEED: "0"

jobs:
  tier0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: uv sync (locked)
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: lint-imports (knotcore isolation)
        run: uv run lint-imports

      - name: mypy (strict kernel)
        run: uv run mypy

      - name: knot selftest --seeds-only (determinism KAT)
        run: uv run knot selftest --seeds-only

      - name: pytest tier0 (offline, no API keys)
        run: uv run pytest -n auto -m tier0 -q

  tier1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: uv sync (locked)
        run: uv sync --locked

      - name: pytest tier1 (offline, no API keys)
        run: uv run pytest -n auto -m tier1 -q --durations=15
